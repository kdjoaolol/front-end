<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gedador de QR Code</title>
    <!-- javascript -->
    <script src="js/scripts.js" defer></script>
    <!-- CSS  -->
    <link rel="stylesheet" href="css/styles.css">
    <!-- Fonte roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <main class="main-content">
        <h1>Gerador de QR Code</h1>
        <form class="form-search" id="form-search">
            <label for="search">Insira uma URL ou texto, para criar um QR Code</label>
            <input type="text" name="search" id="search" placeholder="Digite a URL ou texto...">
            <input type="submit" id="submit-btn" value="Gerar QR Code">
        </form>
    </main>
</body>

</html>
